name: Daily data sync (listings, headlines, rates)

on:
  schedule:
    - cron: "17 10 * * *"   # every day ~5–6am Boston time
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync data
        run: python scripts/sync.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "bulletin-bot"
            git config user.email "bulletin-bot@users.noreply.github.com"
            git add data
            git commit -m "Daily sync: listings, headlines, rates"
            git push
          else
            echo "Nothing changed."
          fi
