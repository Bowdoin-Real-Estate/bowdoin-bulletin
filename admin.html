<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Editor · The Local Loop</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{background:#efebe3}
  .tabs2{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 22px}
  .tabs2 button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:600 .92rem var(--sans);color:var(--muted);cursor:pointer}
  .tabs2 button.on{color:var(--ink);border-color:var(--sage)}
  .ed{display:grid;grid-template-columns:minmax(280px,1fr) 1.25fr;gap:22px;align-items:start}
  .ed.email{grid-template-columns:minmax(300px,380px) 1fr}
  @media(max-width:980px){.ed,.ed.email{grid-template-columns:1fr}}
  .item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:0}
  .item b{display:block}
  .item.on{background:#fbf8f2;margin:0 -12px;padding:12px}
  .field{width:100%;border:1px solid var(--line);border-radius:2px;padding:9px 11px;font:inherit;font-size:.93rem;background:#fff}
  textarea.field{min-height:80px;resize:vertical}
  label.f{display:block;font-weight:600;font-size:.84rem;margin:12px 0 4px;color:var(--ink)}
  .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:8px 0}
  .ib{background:#fff;border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer;font:600 .82rem var(--sans);color:var(--ink);white-space:nowrap}
  .ib:hover{border-color:var(--brass);color:var(--brass)}
  .ib.del:hover{border-color:var(--bad);color:var(--bad)}
  .qa-row{border:1px solid var(--line);background:#fff;padding:10px;margin:8px 0}
  .qa-row .top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.85rem;margin-bottom:6px}
  .imgprev{max-width:100%;max-height:160px;margin-top:6px;border:1px solid var(--line)}
  .scroll{max-height:72vh;overflow:auto}
  .sticky{position:sticky;top:84px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:2px;font-weight:600;display:none;z-index:99;max-width:90vw}
  .pick{border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;background:#fff}
  .cand.picked{opacity:.45}
  .preview-frame{width:100%;height:78vh;border:1px solid var(--line);background:#f4f1eb}
  .pill{display:inline-block;font:600 .68rem var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;background:var(--sea);color:var(--ink);margin-left:6px}
  .pill.warn{background:#fde7d9;color:#8a3a1a}.pill.gold{background:var(--brass-soft);color:#6d531f}
</style>
</head>
<body>
<header class="masthead"><div class="wrap">
  <a class="brand" href="index.html"><div><div class="brand-name">The Local Loop · Editor</div><div class="brand-sub">Private · for Jenny &amp; LeighAnn</div></div></a>
  <nav class="main" style="display:flex"><a href="index.html" target="_blank">View site ↗</a><a href="#" id="signout" style="display:none">Sign out</a></nav>
</div></header>

<main class="wrap" style="padding:24px 20px 60px">
  <section id="login" class="card pad" style="max-width:560px;margin:40px auto;display:none">
    <span class="eyebrow">Sign in</span>
    <h2 style="margin-top:8px">Welcome to The Local Loop editor</h2>
    <p class="muted">Paste the editor key Jake set up for you. You only need to do this once on each computer or phone.</p>
    <label class="f">Who's editing?</label>
    <select id="who" class="field"><option>Jenny</option><option>LeighAnn</option><option>Jake</option></select>
    <label class="f">Editor key</label>
    <input id="tok" class="field" type="password" placeholder="github_pat_…" autocomplete="off">
    <p style="margin-top:14px"><button class="btn brass" id="go">Sign in</button></p>
    <p class="small muted" id="loginmsg"></p>
  </section>

  <section id="app" style="display:none">
    <div class="tabs2" id="tabs">
      <button data-tab="email" class="on">✉️ Build the email</button>
      <button data-tab="events">📅 Events</button>
      <button data-tab="features">⭐ Spotlights &amp; contests</button>
      <button data-tab="qa">⚖️ Q&amp;As</button>
      <button data-tab="stories">📰 Stories</button>
      <button data-tab="market">📈 Market</button>
    </div>
    <p class="small muted" id="whoami" style="margin:-10px 0 18px"></p>
    <div id="panel"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'item';
  const onGH = location.hostname.endsWith('github.io');
  const OWNER = onGH ? location.hostname.split('.')[0] : 'Bowdoin-Real-Estate';
  const REPO = onGH ? (location.pathname.split('/')[1] || 'bowdoin-bulletin') : 'bowdoin-bulletin';
  const API = (p) => `https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}`;
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
  let token = store.get('bb-editor-token'), who = store.get('bb-editor-who') || 'Jenny';
  const S = {}; let tab = 'email';

  /* ---------- GitHub file helpers ---------- */
  const b64dec = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
  const b64enc = (s) => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
  const gh = (url, opts = {}) => fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', ...(opts.headers || {}) } });
  async function getFile(p) {
    const r = await gh(API(p) + '?ref=main&t=' + Date.now());
    if (r.status === 404) return { text: null, sha: null };
    if (r.status === 401 || r.status === 403) throw new Error('That key didn\'t work. Check it has access to the ' + REPO + ' repository.');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    const j = await r.json(); return { text: b64dec(j.content), sha: j.sha };
  }
  async function getJSON(p, fallback) { const f = await getFile(p); return f.text ? JSON.parse(f.text) : fallback; }
  async function putRaw(p, b64, msg) {
    const cur = await getFile(p).catch(() => ({ sha: null }));
    const r = await gh(API(p), { method: 'PUT', body: JSON.stringify({ message: msg, content: b64, branch: 'main', ...(cur.sha ? { sha: cur.sha } : {}) }) });
    if (!r.ok) throw new Error(r.status === 409 ? 'Someone else just saved. Reload and try again.' : 'Save failed (' + r.status + ')');
  }
  const putText = (p, text, msg) => putRaw(p, b64enc(text), msg);
  const putJSON = (p, obj, msg) => putText(p, JSON.stringify(obj, null, 2) + '\n', msg + ' (by ' + who + ')');
  function toast(t, ms) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', ms || 3000); }
  const siteBase = () => (S.config && S.config.site_url) || location.href.replace(/admin\.html.*$/, '');

  async function loadAll() {
    const [config, events, features, qa, news, listings, market, issues] = await Promise.all([
      getJSON('data/config.json', {}), getJSON('data/events.json', { events: [] }), getJSON('data/features.json', { items: [] }), getJSON('data/qa.json', { items: [] }),
      getJSON('data/news.json', {}), getJSON('data/listings.json', { listings: [] }), getJSON('data/market.json', {}), getJSON('data/issues.json', { issues: [] })]);
    Object.assign(S, { config, events, features, qa, news, listings, market, issues });
  }

  async function uploadImage(file, name) {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1400 / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.85), path = `assets/uploads/${Date.now()}-${slug(name)}.jpg`;
    await putRaw(path, dataUrl.split(',')[1], 'Upload image (by ' + who + ')');
    return { url: siteBase() + path, preview: dataUrl };
  }

  /* ---------- date helpers ---------- */
  const parseLocal = (s) => s ? new Date(s.length === 10 ? s + 'T00:00' : s) : null;
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const fmtD = (d, o) => d.toLocaleDateString('en-US', o || { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtT = (d) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(':00', '');
  const evEnd = (e) => parseLocal(e.end) || new Date(parseLocal(e.start).getTime() + 2 * 3600e3);
  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const setPath = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k) => { a[k] = a[k] || {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };

  /* ---------- generic collection editor ---------- */
  function collection(cfg) {
    // cfg: { file, key, label, fields, title(i), sub(i), sort(list), blank(), idOf(i), intro }
    let list = (S[cfg.store][cfg.key] || []).map((x) => JSON.parse(JSON.stringify(x)));
    let idx = -1, draft = null, dirty = false;
    const panel = $('#panel');
    function fieldHTML(f, item) {
      const v = getPath(item, f.k);
      const id = 'f_' + f.k.replace(/\./g, '_');
      const lab = `<label class="f" for="${id}">${esc(f.label)}</label>`;
      const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
      switch (f.type) {
        case 'textarea': case 'md': return lab + `<textarea class="field" id="${id}" data-k="${f.k}" rows="${f.rows || (f.type === 'md' ? 8 : 3)}">${esc(v || '')}</textarea>` + hint;
        case 'checkbox': return `<label class="chk"><input type="checkbox" data-k="${f.k}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>` + hint;
        case 'select': return lab + `<select class="field" id="${id}" data-k="${f.k}">${f.options.map((o) => `<option value="${esc(o[0])}" ${String(v || '') === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>` + hint;
        case 'datetime': return lab + `<input class="field" type="datetime-local" id="${id}" data-k="${f.k}" value="${esc(v || '')}">` + hint;
        case 'date': return lab + `<input class="field" type="date" id="${id}" data-k="${f.k}" value="${esc(v || '')}">` + hint;
        case 'number': return lab + `<input class="field" type="number" step="any" id="${id}" data-k="${f.k}" data-num="1" value="${esc(v == null ? '' : v)}">` + hint;
        case 'image': return lab + `<input class="field" id="${id}" data-k="${f.k}" value="${esc(v || '')}" placeholder="Paste an image link, or upload →">
          <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><label class="ib" style="cursor:pointer">📷 Upload photo<input type="file" accept="image/*" data-upload="${f.k}" hidden></label><span class="hint" data-upmsg="${f.k}"></span></div>
          ${v ? `<img class="imgprev" data-prev="${f.k}" src="${esc(v)}" alt="">` : `<img class="imgprev" data-prev="${f.k}" hidden alt="">`}` + hint;
        case 'qa': return qaEditor(item);
        case 'heading': return `<h4 style="margin:20px 0 0;font-family:var(--sans);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)">${esc(f.label)}</h4>`;
        default: return lab + `<input class="field" id="${id}" data-k="${f.k}" value="${esc(v == null ? '' : v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>` + hint;
      }
    }
    function qaEditor(item) {
      const qs = item.questions || [];
      return `<label class="f">Questions &amp; answers (${qs.length})</label>
        <details style="margin:6px 0 10px" ${qs.length <= 2 ? 'open' : ''}><summary class="small" style="cursor:pointer;font-weight:600">📋 Paste the whole Q&amp;A at once</summary>
          <textarea class="field" id="bulk" rows="8" placeholder="Paste everything here. Questions can start with Q:, 1., or just end with a question mark; answers follow underneath."></textarea>
          <div style="display:flex;gap:8px;margin-top:6px"><button class="ib" data-bulk="replace">Split into questions (replace)</button><button class="ib" data-bulk="append">Add to the end</button></div></details>
        <div id="qarows">${qs.map((x, i) => `<div class="qa-row"><div class="top"><span>Question ${i + 1}</span><span><button class="ib" data-qup="${i}">↑</button> <button class="ib" data-qdown="${i}">↓</button> <button class="ib del" data-qdel="${i}">✕</button></span></div>
          <textarea class="field" rows="2" data-q="${i}" placeholder="Question">${esc(x.q)}</textarea>
          <textarea class="field" rows="5" data-a="${i}" placeholder="Answer" style="margin-top:6px">${esc(x.a)}</textarea></div>`).join('')}</div>
        <button class="ib" data-qadd="1" style="margin-top:6px">+ Add a question</button>`;
    }
    function render() {
      const cur = draft;
      panel.innerHTML = `<div class="ed"><div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <h3 style="margin:0">${esc(cfg.label)} <span class="small muted">(${list.length})</span></h3><button class="btn sm brass" data-new="1">+ New</button></div>
          ${cfg.intro ? `<p class="small muted" style="margin:8px 0 0">${cfg.intro}</p>` : ''}
          <div class="scroll" style="margin-top:8px">${list.length ? list.map((it, i) => `<div class="item ${i === idx ? 'on' : ''}"><div><b>${esc(cfg.title(it))}</b><div class="small muted">${cfg.sub(it)}</div></div>
            <div style="display:flex;gap:6px"><button class="ib" data-edit="${i}">Edit</button><button class="ib del" data-delete="${i}">Delete</button></div></div>`).join('') : '<div class="empty small">Nothing here yet. Click + New.</div>'}</div></div>
        <div class="card pad sticky">${cur ? `<h3 style="margin:0 0 4px">${idx < 0 ? 'New ' + cfg.one : 'Edit ' + cfg.one}</h3>
          <div class="scroll" id="form">${cfg.fields.map((f) => fieldHTML(f, cur)).join('')}</div>
          <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn brass" data-save="1">Save &amp; publish</button><button class="btn ghost sm" data-cancel="1">Cancel</button>${cfg.viewUrl && idx >= 0 ? `<a class="btn ghost sm" target="_blank" href="${esc(cfg.viewUrl(cur))}">View on site ↗</a>` : ''}</div>
          <p class="small" style="color:var(--bad);margin-top:8px;display:${dirty ? 'block' : 'none'}" id="dirty">Unsaved changes</p>`
        : `<div class="empty">Pick something on the left to edit, or click <b>+ New</b>.</div>`}</div></div>`;
    }
    function readForm() {
      if (!draft) return;
      $$('#form [data-k]').forEach((el) => {
        let v = el.type === 'checkbox' ? el.checked : el.value;
        if (el.dataset.num) v = el.value === '' ? null : Number(el.value);
        setPath(draft, el.dataset.k, v);
      });
      if (draft.questions) draft.questions = draft.questions.map((x, i) => ({ q: ($(`[data-q="${i}"]`) || {}).value ?? x.q, a: ($(`[data-a="${i}"]`) || {}).value ?? x.a }));
    }
    function splitQA(text) {
      const paras = text.replace(/\r/g, '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean), out = [];
      const qre = /^\s*(?:Q(?:uestion)?\s*#?\d*\s*[:.)\-–]|\d{1,2}\s*[.)]\s+)/i, are = /^\s*A(?:nswer)?\s*[:.)\-–]\s*/i;
      paras.forEach((p) => {
        const inline = p.match(/^([\s\S]*?)\n\s*A(?:nswer)?\s*[:.)\-–]\s*([\s\S]*)$/i);
        if (inline && (qre.test(inline[1]) || inline[1].trim().endsWith('?'))) { out.push({ q: inline[1].replace(qre, '').trim(), a: inline[2].trim() }); return; }
        const firstLine = p.split('\n')[0];
        if (qre.test(p) || (firstLine.trim().endsWith('?') && firstLine.length < 300 && !are.test(p))) {
          const rest = p.split('\n').slice(1).join('\n').trim();
          out.push({ q: firstLine.replace(qre, '').trim(), a: rest.replace(are, '') });
        } else if (out.length) { const a = p.replace(are, ''); out[out.length - 1].a = (out[out.length - 1].a ? out[out.length - 1].a + '\n\n' : '') + a; }
        else out.push({ q: '', a: p.replace(are, '') });
      });
      return out;
    }
    panel.onclick = async (e) => {
      const t = e.target.closest('button,[data-new]'); if (!t) return;
      const d = t.dataset;
      if (d.new) { if (dirty && !confirm('Discard unsaved changes?')) return; idx = -1; draft = cfg.blank(); dirty = false; render(); }
      else if (d.edit) { if (dirty && !confirm('Discard unsaved changes?')) return; idx = +d.edit; draft = JSON.parse(JSON.stringify(list[idx])); dirty = false; render(); }
      else if (d.cancel) { draft = null; idx = -1; dirty = false; render(); }
      else if (d.delete) {
        const i = +d.delete; if (!confirm(`Delete "${cfg.title(list[i])}"? This removes it from the site.`)) return;
        list.splice(i, 1); if (idx === i) { draft = null; idx = -1; }
        await save('Delete ' + cfg.one);
      }
      else if (d.qadd) { readForm(); draft.questions = draft.questions || []; draft.questions.push({ q: '', a: '' }); render(); }
      else if (d.qdel) { readForm(); draft.questions.splice(+d.qdel, 1); dirty = true; render(); }
      else if (d.qup) { readForm(); const i = +d.qup; if (i > 0) [draft.questions[i - 1], draft.questions[i]] = [draft.questions[i], draft.questions[i - 1]]; dirty = true; render(); }
      else if (d.qdown) { readForm(); const i = +d.qdown; if (i < draft.questions.length - 1) [draft.questions[i + 1], draft.questions[i]] = [draft.questions[i], draft.questions[i + 1]]; dirty = true; render(); }
      else if (d.bulk) {
        readForm(); const parsed = splitQA($('#bulk').value);
        if (!parsed.length) return toast('Nothing to split. Paste the Q&A text first.');
        draft.questions = d.bulk === 'replace' ? parsed : (draft.questions || []).concat(parsed);
        dirty = true; render(); toast(`Split into ${parsed.length} questions. Check them below.`);
      }
      else if (d.save) {
        readForm();
        const err = cfg.validate && cfg.validate(draft); if (err) return toast(err);
        if (!draft.id && cfg.idOf) draft.id = cfg.idOf(draft);
        const wasNew = idx < 0;
        if (idx < 0) { if (draft.id && list.some((x) => x.id === draft.id)) draft.id += '-' + Date.now().toString(36).slice(-4); list.push(draft); }
        else list[idx] = draft;
        if (cfg.sort) list = cfg.sort(list);
        idx = list.indexOf(draft);
        await save((wasNew ? 'Add ' : 'Update ') + cfg.one + ': ' + cfg.title(draft));
      }
    };
    panel.oninput = (e) => { if (e.target.closest('#form')) { dirty = true; const el = $('#dirty'); if (el) el.style.display = 'block'; } };
    panel.onchange = async (e) => {
      const up = e.target.dataset.upload; if (!up || !e.target.files[0]) return;
      readForm(); const msg = $(`[data-upmsg="${up}"]`); msg.textContent = 'Uploading…';
      try { const r = await uploadImage(e.target.files[0], cfg.title(draft) || 'photo'); setPath(draft, up, r.url); dirty = true; render(); const p = $(`[data-prev="${up}"]`); if (p) { p.src = r.preview; p.hidden = false; } const m = $(`[data-upmsg="${up}"]`); if (m) m.textContent = 'Uploaded ✓ (live on the site in ~1 min)'; }
      catch (err) { msg.textContent = err.message; }
    };
    async function save(msg) {
      const btn = $('[data-save]'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      try {
        const fresh = await getJSON(cfg.file, {});
        fresh[cfg.key] = list; S[cfg.store] = fresh;
        await putJSON(cfg.file, fresh, msg);
        dirty = false; toast('Saved! Live on the site in about a minute.');
      } catch (err) { toast(err.message, 5000); }
      render();
    }
    render();
  }

  /* ---------- tab definitions ---------- */
  const CATS = ['Community', 'Holiday', 'Kids & Family', 'Fundraiser', 'Blood Drive', 'Food & Drink', 'Music & Arts', 'Sports & Fitness', 'Classes', 'Open House', 'Other'];
  const TABS = {
    events: () => collection({
      store: 'events', file: 'data/events.json', key: 'events', label: 'Events', one: 'event',
      intro: 'Everything here shows on the community calendar and in the email. ⭐ Featured events get the big banner. Past events hide automatically.',
      title: (e) => e.title || '(untitled)',
      sub: (e) => { const s = parseLocal(e.start); return (s ? fmtD(s) + ' · ' + fmtT(s) : 'No date') + (e.featured ? ' <span class="pill gold">Featured</span>' : '') + (e.sample ? ' <span class="pill warn">Details coming</span>' : '') + (s && evEnd(e) < today0() ? ' <span class="pill">Past</span>' : ''); },
      sort: (l) => l.sort((a, b) => (a.start || '').localeCompare(b.start || '')),
      blank: () => ({ title: '', start: '', end: '', location: '', town: '', category: 'Community', cost: 'Free', url: '', description: '', kid_friendly: false, featured: false, sample: false }),
      idOf: (e) => slug(e.title) + '-' + (e.start || '').slice(0, 10),

  /* ---------- stories (headline picks) ---------- */
  function storiesTab() {
    const news = S.news || {}; let picks = (news.editors_picks || []).map((p) => ({ ...p })), dirty = false;
    const cands = () => (news.pool && news.pool.length) ? news.pool : Object.entries(news.categories || {}).flatMap(([c, items]) => items.map((i) => ({ ...i, category: c })));
    const panel = $('#panel');
    function render() {
      const q = ($('#sq') || {}).value || '', cat = ($('#scat') || {}).value || '', chosen = new Set(picks.map((p) => p.url));
      const all = cands(), cats = [...new Set(all.map((p) => p.category).filter(Boolean))];
      const list = all.filter((p) => (!cat || p.category === cat) && (!q || (p.title + ' ' + p.source).toLowerCase().includes(q.toLowerCase())));
      panel.innerHTML = `<div class="ed"><div class="card pad"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">Story ideas <span class="small muted">(${list.length})</span></h3>
          <div style="display:flex;gap:8px"><select id="scat" class="field" style="width:auto"><option value="">All topics</option>${cats.map((c) => `<option ${c === cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><input id="sq" class="field" style="width:160px" placeholder="Search…" value="${esc(q)}"></div></div>
          <p class="small muted" style="margin:6px 0 0">Collected automatically every morning from the past week's news.${news.updated ? ' Last refreshed ' + new Date(news.updated).toLocaleString() + '.' : ''}</p>
          <div class="scroll" style="margin-top:8px">${list.map((p) => `<div class="item cand ${chosen.has(p.url) ? 'picked' : ''}"><div><a href="${esc(p.url)}" target="_blank" rel="noopener" style="font-weight:600;color:var(--ink);text-decoration:none">${esc(p.title)}</a><div class="small muted">${esc(p.source || '')}${p.category ? ' · ' + esc(p.category) : ''}</div></div>${chosen.has(p.url) ? '<span class="small muted">Added ✓</span>' : `<button class="ib" data-add="${esc(p.url)}">Add</button>`}</div>`).join('') || '<div class="empty small">No story ideas match.</div>'}</div>
          <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">+ Add your own story or link</summary>
            <label class="f">Headline</label><input id="nt" class="field"><label class="f">Link</label><input id="nu" class="field" placeholder="https://"><label class="f">Source</label><input id="ns" class="field">
            <p style="margin-top:10px"><button class="ib" id="addown">Add to this email</button></p></details></div>
        <div class="card pad sticky"><h3 style="margin:0 0 4px">Stories in this email <span class="small muted">(${picks.length})</span></h3><p class="small muted">Reorder with the arrows and add a one-line take.</p>
          ${picks.map((p, i) => `<div class="pick"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:.95rem">${i + 1}. ${esc(p.title)}</b><span style="white-space:nowrap"><button class="ib" data-up="${i}">↑</button> <button class="ib" data-down="${i}">↓</button> <button class="ib del" data-del="${i}">✕</button></span></div>
            <div class="small muted">${esc(p.source || '')}</div><textarea class="field" style="margin-top:6px" rows="2" data-blurb="${i}" placeholder="Our take (optional)">${esc(p.blurb || '')}</textarea></div>`).join('') || '<div class="empty small">No stories picked yet.</div>'}
          <button class="btn brass" id="savepicks" style="margin-top:8px">Save &amp; publish</button> <span class="small" style="color:var(--bad);display:${dirty ? 'inline' : 'none'}">Unsaved changes</span></div></div>`;
    }
    panel.onclick = async (e) => {
      const t = e.target, d = t.dataset;
      if (d.add) { const p = cands().find((x) => x.url === d.add); if (p) { picks.push({ title: p.title, url: p.url, source: p.source || '', category: p.category || '', blurb: '' }); dirty = true; render(); } }
      else if (d.up) { const i = +d.up; if (i > 0) { [picks[i - 1], picks[i]] = [picks[i], picks[i - 1]]; dirty = true; render(); } }
      else if (d.down) { const i = +d.down; if (i < picks.length - 1) { [picks[i + 1], picks[i]] = [picks[i], picks[i + 1]]; dirty = true; render(); } }
      else if (d.del) { picks.splice(+d.del, 1); dirty = true; render(); }
      else if (t.id === 'addown') { const tt = $('#nt').value.trim(), u = $('#nu').value.trim(); if (!tt || !/^https?:\/\//.test(u)) return toast('Add a headline and a full link (https://…)'); picks.push({ title: tt, url: u, source: $('#ns').value.trim(), category: 'Our pick', blurb: '' }); dirty = true; render(); }
      else if (t.id === 'savepicks') {
        t.disabled = true; t.textContent = 'Saving…';
        try { const fresh = await getJSON('data/news.json', {}); fresh.editors_picks = picks.map(({ title, url, source, blurb, category }) => ({ title, url, source, blurb, category })); fresh.picks_updated = new Date().toISOString(); fresh.picks_by = who; await putJSON('data/news.json', fresh, 'Story picks'); S.news = fresh; dirty = false; toast('Published! Live in about a minute.'); }
        catch (err) { toast(err.message, 5000); }
        render();
      }
    };
    panel.oninput = (e) => { if (e.target.dataset.blurb) { picks[+e.target.dataset.blurb].blurb = e.target.value; dirty = true; } else if (e.target.id === 'sq') { const pos = e.target.selectionStart; render(); const el = $('#sq'); el.focus(); el.setSelectionRange(pos, pos); } };
    panel.onchange = (e) => { if (e.target.id === 'scat') render(); };
    render();
  }

  /* ---------- email builder ---------- */
  function upcomingEvents(days) { const now = new Date(), until = new Date(today0().getTime() + days * 864e5); return (S.events.events || []).filter((e) => e.start && evEnd(e) >= now && parseLocal(e.start) < until).sort((a, b) => a.start.localeCompare(b.start)); }

  const pubQA = () => (S.qa.items || []).filter((q) => q.published !== false).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const nextFriday = () => { const d = today0(); d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7)); return d.toISOString().slice(0, 10); };
  let EO = null;

    const fe = upcomingEvents(30).find((e) => e.featured), feats = activeFeatures(), q = pubQA()[0];
    return { date: nextFriday(), headline: fe ? `${fe.title}` : 'What\'s happening around town', subject: fe ? `🎄 ${fe.title} + what's happening around town` : 'What\'s happening around town',
      intro: 'Hi neighbors,\n\nHere\'s what\'s happening around town, from community events to a few stories we think you\'ll love.\n\n– Jenny & LeighAnn',
      days: 21, featured: true, calendar: true, features: feats.map((f) => f.id), qa: q ? q.id : '', stories: true, trivia: true, listings: false, market: true, rates: false };
  }

    const gcal = (e) => { const st = (d) => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00'; return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates: st(parseLocal(e.start)) + '/' + st(evEnd(e)), ctz: 'America/New_York', details: e.description || '', location: [e.location, e.town].filter(Boolean).join(', ') }); };

        } catch (err) { toast(err.message, 5000); }
        t.disabled = false; t.textContent = '📬 Send this to new subscribers automatically';
      } else if (t.id === 'pubweb') {
        if (!confirm('Publish this issue to the website\'s Past Issues page?')) return;
        t.disabled = true; t.textContent = 'Publishing…';
        try {
          const id = issueId();
          await putText(`issues/${id}.md`, issueMarkdown(EO) + '\n', `Issue: ${EO.headline} (by ${who})`);
          const iss = await getJSON('data/issues.json', { issues: [] });
          const list = (iss.issues || []).filter((x) => x.id !== id);
          const num = Math.max(0, ...list.map((x) => +x.number || 0)) + 1;
          const firstLine = (EO.intro || '').split('\n').map((s) => s.trim()).filter((s) => s && !/^hi\b|^hello\b/i.test(s))[0] || '';
          list.unshift({ id, number: num, date: EO.date, title: EO.headline, summary: firstLine.slice(0, 160) });
          iss.issues = list; await putJSON('data/issues.json', iss, 'Add issue ' + num);
          S.issues = iss; EO.published = true; refresh();
          toast('Published! The email now has a "View in browser" link. Copy it again before sending.', 6000);
        } catch (err) { toast(err.message, 5000); }
        t.disabled = false; t.textContent = '🌐 Publish web version (adds to Past Issues)';
      }
    };
    refresh();
  }

  /* ---------- shell ---------- */
  function showTab(name) { tab = name; $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name)); $('#panel').onclick = $('#panel').oninput = $('#panel').onchange = null; TABS[name](); }
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
  async function start() {
    await loadAll();
    $('#whoami').textContent = `Editing as ${who}. Changes go live on the site about a minute after you save.`;
    $('#login').style.display = 'none'; $('#app').style.display = 'block'; $('#signout').style.display = '';
    showTab(tab);
  }
  $('#go').onclick = async () => {
    token = $('#tok').value.trim(); who = $('#who').value; if (!token) return;
    $('#loginmsg').textContent = 'Checking…';
    try { await start(); store.set('bb-editor-token', token); store.set('bb-editor-who', who); }
    catch (e) { $('#loginmsg').textContent = e.message; }
  };
  $('#signout').onclick = (e) => { e.preventDefault(); store.del('bb-editor-token'); location.reload(); };
  $('#who').value = who;
  if (token) start().catch(() => { $('#login').style.display = 'block'; }); else $('#login').style.display = 'block';
})();
</script>
</body>
