<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events</title>
<meta name="description" content="Things to do around Greater Boston: community events, kids' activities, blood drives, holiday happenings and more.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js" defer></script>
<script src="assets/community.js" defer></script>
</head>
<body data-page="events">
<main>
  <section class="hero" style="padding:44px 0 30px"><div class="wrap">
    <span class="eyebrow">Around town</span>
    <h1 style="margin-top:12px">Events around Greater Boston</h1>
    <p class="lead">Family days, blood drives, fundraisers, open houses and more. Add anything to your calendar in one tap.</p>
    <a class="btn brass" id="submit-event" href="#" target="_blank" rel="noopener">Submit an event →</a>
  </div></section>
  <section class="block"><div class="wrap">
    <div id="calendar" style="margin-bottom:36px"></div>
    <h2 style="margin:10px 0 16px">Browse everything</h2>
    <div class="chips" id="chips"></div>
    <div class="filters">
      <select id="town" aria-label="Town"></select>
      <input id="q" type="search" placeholder="Search events…" aria-label="Search events">
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="kids"> Kid-friendly</label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="weekend"> This weekend</label>
    </div>
    <div id="list"></div>
  </div></section>
</main>
</body>
</html>
